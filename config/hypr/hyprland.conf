# ┌─────────────────────────────────────────────────────────────────────┐
# │  Project:Tezca — Hyprland entry point                                │
# │  "Smoking mirror": obsidian black, glass, turquoise/jade accent.     │
# │                                                                       │
# │  This file only SOURCES modular fragments in conf.d/ (DESIGN.md §5).  │
# │  Edit the fragment, not this file. Order matters.                     │
# └─────────────────────────────────────────────────────────────────────┘

# Launched via uwsm — environment lives in ~/.config/uwsm/{env,env-hyprland},
# NOT here. Do not add `env =` lines below; put them in uwsm/env.

source = ~/.config/hypr/conf.d/nvidia.conf
source = ~/.config/hypr/conf.d/monitors.conf
source = ~/.config/hypr/conf.d/input.conf
source = ~/.config/hypr/conf.d/decoration.conf
source = ~/.config/hypr/conf.d/animations.conf
source = ~/.config/hypr/conf.d/windowrules.conf
source = ~/.config/hypr/conf.d/keybinds.conf
# Your rebound keys, generated by `tezca keybind` / the Settings Keybinds page.
# Sourced right after the shipped map so its `unbind`+`bind` pairs win. Lives
# outside the repo, so rebinding a key never dirties the checkout. Created by
# `tezca link`; safe to delete — you get the shipped keybindings back.
source = ~/.config/tezca/keybinds.conf
source = ~/.config/hypr/conf.d/gaming.conf
source = ~/.config/hypr/conf.d/ai.conf
source = ~/.config/hypr/conf.d/autostart.conf

# Hand-written machine-local overrides. Tezca never writes to this file, so it is
# yours: put anything you don't want the tools to reformat here.
source = ~/.config/hypr/conf.d/local.conf

# Generated machine-local overrides — what `tezca hypr set` / `tezca display set`
# and the Settings sliders persist. Sourced LAST, so it wins over everything.
# Lives outside the repo so tuning a setting never dirties the checkout. Created
# by `tezca link`; safe to delete — you get the shipped defaults back.
source = ~/.config/tezca/local.conf
