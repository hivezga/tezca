# Project:Tezca — hyprlock (obsidian lockscreen).
# "Smoking mirror": the wallpaper, darkened and blurred behind a floating glass
# clock + input. Turquoise accent on focus. Native, GPU, NVIDIA-friendly.
#
# Colors + the wallpaper path come from the theme engine: $tz_* variables (and
# $tz_wallpaper) are defined in ~/.config/tezca/current/colors-hyprlock.conf,
# which the `tezca` CLI repoints per theme. Sourced FIRST so the variables exist
# before use below. Edit templates/ or themes/, not this file.
source = ~/.config/tezca/current/colors-hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = $tz_wallpaper
    # Darkened obsidian glass over the wallpaper.
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.05
    vibrancy = 0.15
    color = $tz_base
}

# Big clock, upper-center.
label {
    monitor =
    text = $TIME
    font_size = 92
    font_family = Inter Display Light
    color = $tz_text
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0,0,0,0.5)
}

# Date under the clock.
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = Inter
    color = $tz_muted
    position = 0, 108
    halign = center
    valign = center
}

# "Smoking mirror" wordmark, subtle, above the input.
label {
    monitor =
    text = Tezca
    font_size = 16
    font_family = Inter SemiBold
    color = $tz_accent
    position = 0, 20
    halign = center
    valign = center
}

# Password input — floating obsidian glass pill, turquoise on focus.
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    rounding = 16
    outer_color = $tz_input_outline
    inner_color = $tz_input_bg
    font_color = $tz_text
    check_color = $tz_accent
    fail_color = $tz_urgent
    capslock_color = $tz_gold
    placeholder_text = <span foreground="##8B9398">Unlock</span>
    fail_text = <span foreground="##E06C75">$FAIL</span>
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0,0,0,0.5)
}

# ── Status row ───────────────────────────────────────────────────────────────
# The three questions you have walking back to a locked machine — is it still on
# the network, is it still charged, did anything happen — answerable without
# typing your password. Nothing here is private: no sender, no subject, no SSID
# secret; a count and a percentage.
#
# Each is its own label because hyprlock has no layout container. They are
# spaced by hand along the bottom edge and every one is a `cmd[update:N]`, so a
# command that is missing or fails simply renders empty rather than breaking the
# lock screen — which is the one thing on this machine that must never fail to
# come up.

# Network: the SSID when on Wi-Fi, "Wired" on ethernet, nothing when offline.
label {
    monitor =
    text = cmd[update:30000] nmcli -t -f ACTIVE,SSID device wifi 2>/dev/null | awk -F: '$1=="yes"{print $2; found=1} END{if(!found) system("nmcli -t -f TYPE,STATE device status 2>/dev/null | grep -q \"^ethernet:connected\" && echo Wired")}'
    font_size = 12
    font_family = JetBrains Mono
    color = $tz_muted
    position = -220, 40
    halign = center
    valign = bottom
}

# Battery: percentage only, and only on a machine that has one. The `head -1`
# keeps a dual-battery laptop from printing two lines into one label.
label {
    monitor =
    text = cmd[update:60000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | sed 's/$/%/'
    font_size = 12
    font_family = JetBrains Mono
    color = $tz_muted
    position = 0, 40
    halign = center
    valign = bottom
}

# Notifications that arrived while away. A count, never a preview — the whole
# point of a lock screen is that the contents stay locked.
label {
    monitor =
    text = cmd[update:15000] c=$(swaync-client -c 2>/dev/null); [ -n "$c" ] && [ "$c" != "0" ] && echo "$c waiting"
    font_size = 12
    font_family = JetBrains Mono
    color = $tz_accent
    position = 220, 40
    halign = center
    valign = bottom
}
