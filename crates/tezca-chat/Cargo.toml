# tezca-chat — the SUPER+I local-model chat panel.
#
# A real Hyprland window rather than the layer surface the GTK build used, so
# the tiled area reflows to make room instead of the panel reserving an edge.
# Built in Tauri because the panel is markdown, code blocks, streaming text and
# a copy button — four things a webview does for free and GTK does by hand.
#
# The bar keeps only the module that toggles this, and the two share
# `tezca-llm` so they cannot disagree about what is loaded.
[package]
name = "tezca-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Local-model chat panel for Project:Tezca (Ollama / llama.cpp)"

[[bin]]
name = "tezca-chat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tezca-llm = { path = "../tezca-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
