# tezca-settings — the Project:Tezca control center.
#
# Migrated from GTK4 to Tauri. Eighty-odd controls across thirteen pages, a ⌘K
# palette and a drag-to-arrange canvas are a layout problem CSS is good at and
# GTK CSS is not — the gap audit's settings findings were almost entirely
# CSS-expressiveness gaps: no hairline row idiom, no working type scale, no
# `gap`, no entry animation. The bar stays GTK for the opposite reason, that it
# runs forever on every output and needs wlr-layer-shell rather than layout.
#
# The backend does not change shape. It shells out to `tezca` for all real work,
# so the GUI and the keybinds drive the same code paths and the footer can show
# you the invocation your click just made.
[package]
name = "tezca-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Control center for Project:Tezca (themes, wallpaper, displays, keybinds, gaming, session)"

[[bin]]
name = "tezca-settings"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the Appearance page render the real wallpaper
# file rather than a stand-in. Scoped to $HOME in tauri.conf.json.
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The bar's module vocabulary, shared with `tezca-bar` and the CLI. The Modules
# editor offers exactly what the bar can render because it is the same list.
tezca-barlayout = { path = "../tezca-barlayout" }
