# Project:Tezca — tezca-bar configuration.
#
# The bespoke gtk4-rs top menubar (DESIGN.md §6), replacing Waybar. A thin
# translucent obsidian strip across the top of every monitor: per-app label +
# workspaces on the left, now-playing centred, metrics/controls/clock/power on
# the right, with expandable glass popovers. Colors follow the active theme
# (`tezca theme`) automatically — nothing here hard-codes a hex.
#
# tezca-bar reads this file on launch; `tezca bar restart` after editing (or
# `tezca bar set <key> <value>`, which edits + restarts for you).

# --- Shape -----------------------------------------------------------------
# floating : rounded glass strip, inset from the screen edges (macOS feel).
# edge     : full-width, square, edge-to-edge, single bottom hairline.
shape = floating

# --- Geometry --------------------------------------------------------------
height = 40  # bar height, px (the glass strip)
margin_top = 6  # gap above the bar (floating only), px
margin_side = 10  # gap left/right of the bar (floating only), px

# --- Poll intervals (seconds) ----------------------------------------------
cpu_interval = 3  # CPU sparkline + percentage
mem_interval = 5  # MEM sparkline + percentage
gpu_interval = 3  # GPU sparkline + percentage (auto-hidden if no GPU source)
net_interval = 5  # network glyph + throughput

# --- Clock -----------------------------------------------------------------
# strftime-style; matches the Waybar format the bar reaches parity with.
clock_format = %a %d %b   %H:%M

# Extra time zones listed in the clock popover, comma separated. Each entry is
# `Label=Area/City`, or just `Area/City` to label it with the city name. The
# times come from `date` with TZ set, so anything in /usr/share/zoneinfo works.
# Empty (the default) hides the section.
# clock_zones = Berlin=Europe/Berlin, San Francisco=America/Los_Angeles, UTC

# --- AI provider usage -----------------------------------------------------
# The [󰚩 41%] module: how much of your AI subscription's rate-limit window
# you've burned. Click it for the per-provider breakdown.
#
# This and `weather` below are the only two modules that can make a network
# request, so both are opt-in and deliberately conservative. What it will and won't do:
#   * It never stores a credential. There is no Tezca keyring entry and no
#     token in this file. It reads the credential file the provider's own CLI
#     already wrote (e.g. ~/.claude/.credentials.json, mode 0600) for one
#     request, and never writes to it.
#   * The token is passed to curl on stdin, never on the command line, so it
#     can't be scraped out of /proc/<pid>/cmdline by other local processes.
#   * Hosts are allowlisted in the source (crates/tezca-bar/src/ai.rs), HTTPS
#     is pinned, and redirects are refused — no config value can widen that.
#   * Error text is scrubbed of anything token-shaped before display.
#   * No telemetry. Nothing is ever reported back to Tezca.
# Set ai_live = false for a fully offline mode: no network at all, just the
# token counts computed from your own local logs.
ai_enabled = true

# Which providers to poll, comma-separated: anthropic, openai, google.
# A provider whose CLI/credentials aren't installed hides itself silently, so
# listing one you don't use costs nothing. Unknown names are ignored.
#   anthropic → live 5h/weekly plan limits + local token & cost totals
#   openai    → Codex 5h/weekly limits via the local `codex app-server`
#   google    → approximate daily token count from Gemini CLI session files
#               (Google exposes no quota API — treat it as a warning signal)
ai_providers = anthropic

# Seconds between polls. Clamped to a 60s floor: the Anthropic usage endpoint
# is aggressively rate-limited and shares its 429 bucket with Claude Code
# itself, so polling hard would throttle your actual work. 300 is plenty.
ai_interval = 300

# Allow network requests. false = offline mode — local logs only, so no plan
# percentages (those are server-side state), just today's tokens and cost.
ai_live = true

# Compute today's token totals and API-equivalent cost from local logs.
# Purely local filesystem work; needs no credentials and no network.
ai_local = true

# Percent thresholds where the module turns gold, then urgent-red.
ai_warn = 60
ai_critical = 85

# --- Weather ---------------------------------------------------------------
# The second (and last) module that touches the network, and the only one that
# discloses something about *you* rather than about an account you already have:
# it sends coordinates to a third party. So it is off until you turn it on, and
# there is no geolocation lookup — the bar never tries to work out where you are.
# You write the coordinates, or there is no weather.
#
# The source is Open-Meteo, chosen because it needs no key and no account: there
# is no credential to store, leak, or tie the request back to you. The host
# allowlist is in the source (crates/tezca-bar/src/weather.rs), HTTPS is pinned
# and redirects are refused, exactly as for the AI module. No telemetry, ever.
weather_enabled = false

# Decimal degrees. BOTH are required — the module stays off with only one, and
# a value outside the globe is treated as a typo and discarded.
#
# You do not have to find these yourself. Either of these fills them in:
#   tezca bar weather search Guadalajara   look a town or city up by name
#   tezca bar weather here                 guess from your public IP
# Both print the coordinates and the exact `tezca bar weather set …` line that
# saves them, so nothing is written until you run it.
#
# `here` is the ONE call in Tezca that tells a third party where you are without
# being told: your IP goes to ipapi.co (or ipwho.is if that refuses) and a city
# comes back. It is never called automatically — not on a poll, not at startup —
# only when you type it. It is also only a guess: on a VPN it will place you in
# another country, which is why it shows the answer for you to check rather than
# saving it. The result is stored as plain coordinates below, so the lookup
# never has to happen again.
#   e.g. Mexico City: 19.4326 / -99.1332
weather_lat =
weather_lon =

# What to call it on screen. Purely a label; it is never sent anywhere, so put
# whatever you actually call the place.
weather_place =

# Seconds between polls (clamped to a 300s floor). Weather moves on the scale of
# tens of minutes; a tighter loop is free load on a service that charges nothing.
weather_interval = 900

# "celsius" (default) or "fahrenheit". The API is asked for Celsius either way
# and the conversion happens locally, so your display preference never varies
# the request.
weather_unit = celsius

# Also fetch the air-quality index. This lives on a SECOND endpoint, so turning
# it on means a second request to a second host per poll — hence its own switch.
weather_aqi = false

# --- Per-monitor adaptive --------------------------------------------------
# Monitors narrower than this (px) render the COMPACT layout — no per-app menu
# label, tighter padding. The 3440×1440 ultrawide primary stays full; the
# 2560×1440 secondary goes compact. Set very high to force compact everywhere.
compact_width = 3000

# --- Workspaces ------------------------------------------------------------
# Pill labels: "arabic" (1 2 3 …) or "mayan" — the Mesoamerican bar-and-dot
# numerals (a dot = 1, a bar = 5). The bar draws these itself rather than using
# the Unicode Mayan Numerals block, so no extra font is needed. Workspaces above
# 19 fall back to the digit: past there a vigesimal numeral is a stack of
# positional rows, which is unreadable at pill size.
workspace_numerals = mayan

# Show only workspaces that are in use — occupied by a window, or focused —
# hiding empty pills. Applies to both assigned and dynamic sets.
workspace_hide_empty = true

# Auto-compact each monitor's assigned set: when a workspace you're not looking
# at empties out, the higher workspaces in that monitor's set slide down to
# close the gap (windows move, staying on the same monitor; the workspace you're
# viewing never moves). Needs a `workspaces.<connector>` assignment above.
workspace_compact = true

# Assign which workspaces each monitor's bar shows, by connector name. A monitor
# listed here shows exactly those pills, always (empty ones included), in order;
# unlisted monitors mirror whatever Hyprland has placed on them. Accepts an
# explicit list ("1,3,5,7,9"), a range ("1-5"), or the shorthands "odd"/"even".
# Keep these in step with the Hyprland `workspace = N, monitor:X` binding rules
# in conf.d/monitors.conf so a pill switches to a workspace that lives here.
#   DP-1 = Xiaomi ultrawide · DP-3 = LG UltraGear (see `hyprctl monitors`).
workspaces.DP-1 = odd  # 1 3 5 7 9  on the Xiaomi ultrawide
workspaces.DP-3 = even  # 2 4 6 8 10 on the LG

# --- On-screen display (OSD) ----------------------------------------------
# The transient glass pill that fades in mid-screen when the volume goes up,
# down, or mutes — from ANY source (the volume keys, an app, the bar's own
# mixer), because it watches PipeWire/PulseAudio for the change rather than only
# our keybinds. Needs `pactl` (ships with pipewire-pulse); silently off without.
# The same pill also shows backlight brightness changes on laptops (any panel
# under /sys/class/backlight); desktops with DDC-only monitors have no such
# panel, so the brightness OSD simply never fires there — zero cost.
osd_enabled = true

# How long the pill stays up before it fades out, milliseconds (clamped 400 …
# 10000). Each new change resets the timer, so holding volume-up keeps it up.
osd_timeout_ms = 2600

# --- Right cluster ---------------------------------------------------------
# Twenty-odd modules is a lot of bar. There is no single right answer to that —
# it depends on how wide your monitor is and how much of the cluster you
# actually read — so pick one:
#   all      every module, all the time (the original behaviour)
#   grouped  the camera/mic/recording indicators collapse into one "N capturing"
#            chip, and cpu/mem/gpu into one "SYS" chip. Click a chip to open it,
#            click the fold control inside to close it again. Nothing is hidden:
#            the privacy chip goes red the moment anything is capturing.
#   hover    everything stays put, but the ambient modules (keep-awake, night
#            light, tray, bluetooth, brightness) fade back until you move the
#            pointer onto the bar. Opacity only, so nothing ever resizes.
#   tiers    the third-tier modules (keep-awake, night light, tray, gpu,
#            brightness) are dropped from the layout entirely.
clutter = all

# --- Modules / layout ------------------------------------------------------
# Which modules each region of the bar shows, and in what order. Edit these by
# hand or from Settings ▸ Bar ▸ Modules (which writes the same keys). A module
# left out of every region simply doesn't render; `sep` inserts a hairline
# divider and may be repeated. Leading/trailing and doubled separators are
# collapsed automatically, and on a compact (narrow) monitor `appname` is
# dropped — so one layout serves both the ultrawide and the secondary.
#
# Valid ids:
#   mirror      Tezca menu (the smoking-mirror glyph)
#   appname     focused window's app name (full monitors only)
#   workspaces  workspace pills
#   submap      active-submap indicator (auto-hides)
#   nowplaying  media title/artist + equaliser (auto-hides)
#   gamemode    game-mode glyph (auto-hides)
#   camera      camera-in-use privacy indicator (auto-hides; red when live)
#   microphone  mic-in-use privacy indicator (auto-hides; gold when recording)
#   recording   screen-recording indicator (auto-hides; red — catches any
#               recorder, not only `tezca record`)
#   caffeine    keep-awake; click to hold/release the idle inhibitor
#   night       night light; shown only while the filter is on, click to toggle
#   ai          AI provider usage (auto-hides; see the AI section above)
#   weather     current conditions (auto-hides; see the Weather section above)
#   tray        system tray / StatusNotifierItem icons (auto-hides)
#   cpu mem gpu hardware metric sparklines (gpu auto-hides without a source)
#   network     wifi/ethernet glyph → detail + radio toggle popover
#   bluetooth   adapter + connected devices w/ battery (auto-hides with no adapter)
#   volume brightness battery            controls (brightness/battery auto-hide)
#   bell        notification bell
#   clock       clock → calendar popover
#   power       power / logout button
#   sep         a thin divider (repeatable)
#
# Community / custom modules: drop a `<name>.toml` manifest in
# ~/.config/tezca-bar/modules/ (a shell command whose output drives a widget —
# see the example + README in that folder) and reference it in a region as
# `custom:<name>`, e.g.  layout_right = cpu, sep, custom:weather, clock
#
# A module may appear in only ONE region. A GTK widget has a single parent, so
# the bar renders it wherever it is reached first (left, then centre, then right)
# and logs the duplicate; listing `nowplaying` in both left and centre does not
# put it in both places, it quietly takes it out of the centre.
#
# `tezca bar modules` prints every id with a one-line description, and
# `tezca bar set layout_<region> …` refuses a value naming a module that does not
# exist rather than dropping it silently at the next restart.
#
# The defaults below reproduce the original built-in arrangement exactly.
layout_left = mirror, sep, appname, sep, workspaces, submap
layout_center = nowplaying
layout_right = gamemode, camera, microphone, recording, caffeine, night, ai, tray, cpu, mem, gpu, sep, network, bluetooth, volume, brightness, battery, sep, bell, clock, power

# --- Per-monitor layout ----------------------------------------------------
# Append `.<connector>` to any of the three keys above to give one monitor its
# own arrangement; monitors with no override for a region use the shared key, so
# the common case still needs only the three lines above. Same connector names as
# `workspaces.<connector>` (see `hyprctl monitors`).
#
# This is how you thin out a narrower monitor. The centre region is centred on
# the *screen*, which means the pill can only be as wide as the room the wider
# side cluster leaves mirrored on both sides — on a 2560px monitor a twenty-module
# right cluster leaves almost none, and the now-playing pill shrinks to fit or
# hides. Moving a few modules off the right cluster there gives it back.
#
#   layout_right.DP-3 = ai, cpu, mem, sep, network, volume, sep, bell, clock, power
#   layout_left.DP-3 = mirror, sep, workspaces
#
# An override set to nothing at all means "this monitor shows no modules in this
# region" — the one case where an empty value is a value. `tezca bar unset
# layout_right.DP-3` removes the override so the monitor follows the shared key
# again (Settings ▸ Bar ▸ Modules has the same control).
