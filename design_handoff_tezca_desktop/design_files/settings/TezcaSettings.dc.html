  followWall:true, animations:true, blur:true,
  osd:true, hideEmpty:true, compactWs:true, aiEnabled:true, tray:true, vrr:true,
  micBoost:false, popRemoval:true,
  naturalScroll:true, tapClick:true, numlock:false,
  wifi:true, bluetooth:true, airplane:false, vpn:false,
  caffeine:false, dimIdle:true, lidSleep:true,
  svcBar:true, svcDock:true, svcIdle:true, svcNotify:true,
  gameMode:false, gmDisableAnim:true, gmNotifSilence:true, gmGamescope:false,
  autoUpdate:true,
  shadows:true, forceNoAccel:false, focusFollows:true, hideCursorTyping:true, softwareCursors:false
};
const SEGS = {
  theme:'quetzalcoatl', wall:'obsidianTeal', wallMode:'fill', barShape:'floating', numerals:'mayan',
  audioOut:'speakers', kbLayout:'us', accelProfile:'flat', pointerSpeed:'medium',
  sleepAfter:'30m', powerProfile:'balanced'
};
const SLIDERS = {
  barHeight:{v:40,min:24,max:64,unit:'px'}, barMargin:{v:6,min:0,max:24,unit:'px'},
  dockIcon:{v:48,min:32,max:80,unit:'px'}, dockScale:{v:160,min:100,max:250,unit:'%'}, dockInfluence:{v:110,min:40,max:220,unit:'px'},
  volume:{v:64,min:0,max:100,unit:'%'}, micLevel:{v:82,min:0,max:100,unit:'%'},
  keyRepeat:{v:35,min:10,max:80,unit:'/s'}, keyDelay:{v:250,min:120,max:600,unit:'ms'}, cursorSize:{v:24,min:16,max:48,unit:'px'},
  idleDim:{v:5,min:1,max:30,unit:'min'}, idleLock:{v:10,min:1,max:60,unit:'min'}, rounding:{v:12,min:0,max:28,unit:'px'},
  barSide:{v:10,min:0,max:40,unit:'px'}, osdTimeout:{v:1400,min:400,max:10000,unit:'ms'},
  cpuPoll:{v:3,min:1,max:30,unit:'s'}, memPoll:{v:5,min:1,max:30,unit:'s'}, gpuPoll:{v:3,min:1,max:30,unit:'s'},
  netPoll:{v:5,min:1,max:30,unit:'s'}, compactWidth:{v:3000,min:1000,max:5000,unit:'px'},
  dockGap:{v:10,min:0,max:32,unit:'px'}, dockMargin:{v:8,min:0,max:40,unit:'px'}, dockDelay:{v:350,min:0,max:2000,unit:'ms'},
  innerGaps:{v:5,min:0,max:40,unit:'px'}, outerGaps:{v:10,min:0,max:60,unit:'px'}, borderSize:{v:2,min:0,max:8,unit:'px'},
  activeOpacity:{v:100,min:50,max:100,unit:'%'}, inactiveOpacity:{v:92,min:30,max:100,unit:'%'},
  blurSize:{v:8,min:1,max:20,unit:''}, blurPasses:{v:2,min:1,max:5,unit:''},
  sensitivity:{v:0,min:-100,max:100,unit:''}, scrollSpeed:{v:100,min:20,max:300,unit:'%'}
};
const TEXTS = { clockFormat:'%a %d %b   %H:%M', kbVariant:'', kbOptions:'caps:escape' };
const CMD = {
  theme:'tezca theme set', wall:'tezca wall set', wallMode:'tezca wall mode', barShape:'tezca bar set shape', numerals:'tezca bar set workspace_numerals',
  audioOut:'tezca audio out', kbLayout:'tezca input layout', accelProfile:'tezca input accel',
  pointerSpeed:'tezca input speed', sleepAfter:'tezca power idle', powerProfile:'tezca power profile',
  barHeight:'tezca bar set height', barMargin:'tezca bar set margin_top', dockIcon:'tezca dock set icon_size',
  dockScale:'tezca dock set max_scale', dockInfluence:'tezca dock set influence', volume:'tezca audio volume', micLevel:'tezca audio mic', keyRepeat:'tezca input repeat-rate',
  keyDelay:'tezca input repeat-delay', cursorSize:'tezca input cursor-size', idleDim:'tezca power dim-after',
  idleLock:'tezca power lock-after', rounding:'tezca desktop rounding',
  followWall:'tezca theme follow-wallpaper', animations:'tezca desktop animations', blur:'tezca desktop blur',
  osd:'tezca bar set osd_enabled', hideEmpty:'tezca bar set workspace_hide_empty', compactWs:'tezca bar set workspace_compact',
  aiEnabled:'tezca bar set ai_enabled', tray:'tezca bar module tray',
  vrr:'tezca display vrr', micBoost:'tezca audio mic-boost', popRemoval:'tezca audio pop-removal',
  naturalScroll:'tezca input natural-scroll', tapClick:'tezca input tap-to-click', numlock:'tezca input numlock',
  wifi:'tezca net wifi', bluetooth:'tezca net bluetooth', airplane:'tezca net airplane', vpn:'tezca net vpn',
  caffeine:'tezca power caffeine', dimIdle:'tezca power dim', lidSleep:'tezca power lid-sleep',
  svcBar:'tezca service bar', svcDock:'tezca service dock', svcIdle:'tezca service hypridle', svcNotify:'tezca service swaync',
  gameMode:'tezca game', gmDisableAnim:'tezca game set disable_anim', gmNotifSilence:'tezca game set silence_notifications',
  gmGamescope:'tezca game set gamescope', autoUpdate:'tezca update auto',
  barSide:'tezca bar set margin_side', osdTimeout:'tezca bar set osd_timeout_ms',
  cpuPoll:'tezca bar set cpu_interval', memPoll:'tezca bar set mem_interval', gpuPoll:'tezca bar set gpu_interval',
  netPoll:'tezca bar set net_interval', compactWidth:'tezca bar set compact_width',
  dockGap:'tezca dock set gap', dockMargin:'tezca dock set margin_bottom', dockDelay:'tezca dock set hide_delay_ms',
  innerGaps:'tezca desktop set general:gaps_in', outerGaps:'tezca desktop set general:gaps_out',
  borderSize:'tezca desktop set general:border_size',
  activeOpacity:'tezca desktop set decoration:active_opacity', inactiveOpacity:'tezca desktop set decoration:inactive_opacity',
  blurSize:'tezca desktop set decoration:blur:size', blurPasses:'tezca desktop set decoration:blur:passes',
  shadows:'tezca desktop set decoration:shadow:enabled',
  sensitivity:'tezca desktop set input:sensitivity', scrollSpeed:'tezca desktop set input:touchpad:scroll_factor',
  forceNoAccel:'tezca desktop set input:force_no_accel', focusFollows:'tezca desktop set input:follow_mouse',
  hideCursorTyping:'tezca desktop set cursor:hide_on_key_press', softwareCursors:'tezca desktop set cursor:no_hardware_cursors',
  clockFormat:'tezca bar set clock_format', kbVariant:'tezca input variant', kbOptions:'tezca input options'
};

const PALETTE_ITEMS = [
  ['appearance','Appearance','Theme','quetzalcoatl'],
  ['appearance','Appearance','Wallpaper','2 installed'],
  ['appearance','Appearance','Window gaps','10 px'],
  ['bar','Bar','Bar shape','floating'],
  ['bar','Bar','Workspace numerals','mayan'],
  ['bar','Bar','Bar modules','21 active'],
  ['bar','Bar','AI usage module','on'],
  ['dock','Dock','Magnification','1.6×'],
  ['dock','Dock','Pinned favourites','4 apps'],
  ['displays','Displays','Night light','off'],
  ['displays','Displays','Refresh rate','165 Hz'],
  ['sound','Sound','Output device','speakers'],
  ['input','Input','Keyboard layout','us'],
  ['input','Input','Cursor size','24 px'],
  ['network','Network','Wi-Fi','Coatlicue-5G'],
  ['network','Network','Bluetooth','2 devices'],
  ['power','Power','Idle timeouts','dim 5m · lock 10m'],
  ['keybinds','Keybinds','SUPER + RETURN','terminal'],
  ['keybinds','Keybinds','SUPER + SHIFT + A','settings'],
  ['gaming','Gaming','Game mode','off'],
  ['startup','Startup','Tezca services','4 running'],
  ['system','System','Log out','SUPER + SHIFT + Q']
];

const WALLFILE = { obsidianTeal:'obsidian-teal.jpg', smokeLight:'smoke-light.jpg' };
const OPTS = { theme:['obsidian','quetzalcoatl','huitzilopochtli','xipe','smoke'], wall:['obsidianTeal','smokeLight'], wallMode:['fill','fit','stretch','tile'],
  barShape:['floating','edge'], numerals:['arabic','mayan'],
  audioOut:['speakers','headphones','hdmi'], kbLayout:['us','es','latam'], accelProfile:['flat','adaptive'],
  pointerSpeed:['slow','medium','fast'], sleepAfter:['15m','30m','1h','never'], powerProfile:['power-saver','balanced','performance'] };

class Component extends DCLogic {
  state = { page:'appearance', palette:false, q:'', v:{...TOGGLES, ...SEGS, ...TEXTS, ...Object.fromEntries(Object.entries(SLIDERS).map(([k,s])=>[k,s.v]))}, cmd:'tezca settings --page appearance' };

  set(k, val){ const shown = k==='wall' ? WALLFILE[val] : val;
    this.setState(s=>({ v:{...s.v,[k]:val}, cmd:(CMD[k]||('tezca set '+k))+' '+shown })); }
  toggle(k){ const nv = !this.state.v[k]; this.setState(s=>({ v:{...s.v,[k]:nv}, cmd:(CMD[k]||('tezca set '+k))+' '+(nv?'on':'off') })); }

  renderVals(){
    const isRail = (this.props.shell || 'grouped') === 'rail';
    const g = GROUP[this.state.page];

    const navOn = {}, go = {}, railOn = {}, goGroup = {};
    Object.keys(GROUP).forEach(id => { navOn[id] = this.state.page===id; go[id] = () => this.setState({ page:id, palette:false, cmd:'tezca settings --page '+id }); });
    ['look','devices','system'].forEach(gr => { railOn[gr] = g===gr;
      goGroup[gr] = () => { const first = Object.keys(GROUP).find(k=>GROUP[k]===gr); this.setState({ page:first, cmd:'tezca settings --page '+first }); }; });

    const tog = {};
    Object.keys(TOGGLES).forEach(k => { tog[k] = () => this.toggle(k); });

    const sel = {}, pick = {};
    Object.entries(OPTS).forEach(([k, vals]) => { sel[k] = {}; pick[k] = {};
      vals.forEach(val => { sel[k][val] = this.state.v[k]===val; pick[k][val] = () => this.set(k,val); }); });

    const setSl = {}, txt = {};
    Object.entries(SLIDERS).forEach(([k, s]) => {
      setSl[k] = (e) => this.set(k, Number(e.target.value));
      const val = this.state.v[k];
      txt[k] = k==='dockScale' ? (val/100).toFixed(2)+'×'
        : k==='sensitivity' ? (val/100).toFixed(2)
        : s.unit ? val+' '+s.unit : String(val);
    });
    const setTx = {};
    Object.keys(TEXTS).forEach(k => { setTx[k] = (e) => this.set(k, e.target.value); });

    const tcOn = {};
    OPTS.theme.forEach(name => { tcOn[name] = this.state.v.theme===name; });

    const p = {}; Object.keys(GROUP).forEach(id => { p[id] = this.state.page===id; });

    const q = this.state.q.trim().toLowerCase();
    const results = PALETTE_ITEMS.filter(it => !q || (it[1]+' '+it[2]+' '+it[3]).toLowerCase().includes(q)).slice(0,7).map((it,i) => ({
      page: it[1], label: it[2], hint: it[3], on: i===0,
      go: () => this.setState({ page:it[0], palette:false, q:'', cmd:'tezca settings --page '+it[0] })
    }));

    return {
      look: this.props.look || 'obsidian', accent: this.props.accent || '', density: this.props.density || 'comfortable',
      shellKey: isRail ? 'rail' : 'grouped',
      navOn, go, railOn, goGroup, tog, sel, pick, setSl, txt, setTx, tcOn, v:this.state.v, p,
      emit: (cmd) => this.setState({ cmd }),
      isRail, showLook: !isRail || g==='look', showDevices: !isRail || g==='devices', showSystem: !isRail || g==='system',
      paletteOpen: this.state.palette,
      openPalette: () => this.setState({ palette:true }),
      closePalette: () => this.setState({ palette:false, q:'' }),
      stop: (e) => e.stopPropagation(),
      q: this.state.q, onQ: (e) => this.setState({ q:e.target.value }), results,
      wallFile: WALLFILE[this.state.v.wall],
      showEcho: this.props.showEcho !== false,
      lastCmd: '$ ' + this.state.cmd
    };
  }

  componentDidMount(){
    this._k = (e) => {
      if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); this.setState(s=>({palette:!s.palette})); }
      if (e.key==='Escape') this.setState({palette:false, q:''});
    };
    window.addEventListener('keydown', this._k);
  }
  componentWillUnmount(){ window.removeEventListener('keydown', this._k); }
}
</script>
</body>
</html>
