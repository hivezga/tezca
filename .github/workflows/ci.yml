# Project:Tezca CI.
#
# Two jobs, split by whether they need a GTK toolchain:
#
#   * `cli` — the std-only `tezca` control binary (DESIGN.md §8). No system
#     dependencies at all, so this job is fast and cannot break for reasons
#     unrelated to the code. It also carries most of the test suite: the config
#     rewriting, the keybind override layer, the symlink/seed logic, and the input
#     validation all live here, and those are the paths that can damage a session.
#   * `gtk` — the three gtk4-rs binaries (bar, dock, settings).
#
# Formatting is gated too, in the `cli` job — it needs no system dependencies, so
# there is no reason to make anyone wait on the GTK job to hear about it. The
# style itself lives in `rustfmt.toml` at the repo root, which was fitted to the
# code rather than the other way round; read its header before changing it.

name: ci

on:
  # Every branch, not just main: a feature branch is exactly where you want to
  # find out that clippy or a test broke. Same-repo pull requests therefore run
  # twice; `pull_request` is kept anyway so contributions from forks are covered.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning that reaches main is a warning nobody will ever fix.
  RUSTFLAGS: -D warnings

jobs:
  cli:
    name: tezca CLI (std-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # First, and for the whole workspace: it is the cheapest check here (no
      # build at all), and a formatting failure should not be something you find
      # out about after waiting for clippy.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy -p tezca-cli --all-targets -- -D warnings
      - name: test
        run: cargo test -p tezca-cli
      - name: build (release, as install.sh does)
        run: cargo build -p tezca-cli --release

  gtk:
    name: bar · dock · settings (gtk4-rs)
    # Pinned, not `ubuntu-latest`. Two reasons: an image bump should be a commit,
    # not a surprise; and the version matters here, because gtk4-layer-shell is
    # not packaged for Ubuntu until 25.10 (24.04 has no `libgtk4-layer-shell-dev`
    # at all). `ubuntu-26.04` does package it, but that image is still preview, so
    # gating CI on it trades one flavour of surprise for another.
    #
    # Re-checked 2026-08-01: actions/runner-images still marks both `ubuntu-26.04`
    # and `ubuntu-26.04-arm` as preview, and `ubuntu-latest` still resolves to
    # 24.04. So this stays as it is; see the source build below for what changes
    # when that flips.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev meson ninja-build pkg-config

      # Built from a pinned tag rather than installed from apt, since 24.04 does
      # not ship it. The version matches what the project builds against locally.
      # Once `ubuntu-26.04` is GA this whole step becomes
      # `apt-get install libgtk4-layer-shell-dev`.
      - name: build gtk4-layer-shell ${{ env.LAYER_SHELL_VERSION }}
        env:
          LAYER_SHELL_VERSION: v1.3.0
        run: |
          git clone --depth 1 --branch "$LAYER_SHELL_VERSION" \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          # introspection/vapi are on by default and pull in gobject-introspection
          # and valac. The Rust bindings link the C library directly through their
          # own -sys crate, so GIR and Vala data are dead weight here — and without
          # this, meson fails looking for gobject-introspection-1.0.
          meson setup build --prefix=/usr \
            -Dexamples=false -Ddocs=false -Dtests=false -Dsmoke-tests=false \
            -Dintrospection=false -Dvapi=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          # The pkg-config module carries the ABI suffix (it installs
          # gtk4-layer-shell-0.pc), which is also the name the -sys crate probes for.
          # Asserting it here turns "the crate can't find the library" into a failure
          # in this step, where the log actually explains why.
          pkg-config --modversion gtk4-layer-shell-0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # The bar's tests spawn short-lived child processes (the custom-module
        # runner's timeout and output-cap cases), so they need a real shell but no
        # display: nothing here opens a GTK window.
        run: cargo test --workspace
