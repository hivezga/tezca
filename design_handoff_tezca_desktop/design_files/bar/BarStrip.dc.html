<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet><script src="./image-slot.js"></script><style>[data-num="arabic"] .mayan{display:none}[data-num="mayan"] .arabic{display:none}.mayan{display:flex;flex-direction:column;align-items:center;gap:2px;padding:1px 0}.mayanrow{display:flex;gap:2.5px;align-items:center;height:4px}.eq{display:flex;align-items:flex-end;gap:1.5px;height:11px}.eq>i{width:2px;border-radius:1px;background:var(--accent);animation:tzeq 1.1s ease-in-out infinite}.eq>i:nth-child(2){animation-delay:.18s}.eq>i:nth-child(3){animation-delay:.36s}.eq>i:nth-child(4){animation-delay:.54s}.privdot{animation:tzpulse 2s ease-in-out infinite}.tzaccel{font-family:var(--mono);font-size:9.5px;color:var(--accent)}.tzaccel[data-accel="true"]{color:var(--gold)}.tztps[data-busy="true"]{color:var(--accent)}</style></helmet><div class="tzbar {{ submapClass }}" data-num="{{ s.numerals }}" style="position:relative"><button onClick="{{ onOpen.mirror }}" data-mod="mirror" class="tzmod" style="padding:0 10px 0 8px" title="Tezca menu"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.4" fill="var(--accent)" stroke="none"></circle><path d="M12 3v2.6M12 18.4V21M3 12h2.6M18.4 12H21"></path></svg></button><div class="tzsep"></div><div class="tzmod" style="gap:9px;cursor:default"><span style="font-weight:700;color:var(--text)">Ghostty</span><div class="appmenu" style="display:flex;gap:2px"><span class="tzmod" style="padding:0 9px;height:22px;font-size:12px">File</span><span class="tzmod" style="padding:0 9px;height:22px;font-size:12px">Edit</span><span class="tzmod" style="padding:0 9px;height:22px;font-size:12px">View</span></div></div><div class="tzsep"></div><div style="display:flex;align-items:center;padding:0 4px"><button onClick="{{ onWs.1 }}" class="tzws {{ w.1 }}"><span class="arabic">1</span><span class="mayan"><span class="mayanrow"><i class="tzdot"></i></span></span></button><button onClick="{{ onWs.2 }}" class="tzws {{ w.2 }}"><span class="arabic">2</span><span class="mayan"><span class="mayanrow"><i class="tzdot"></i><i class="tzdot"></i></span></span></button><button onClick="{{ onWs.3 }}" class="tzws {{ w.3 }}"><span class="arabic">3</span><span class="mayan"><span class="mayanrow"><i class="tzdot"></i><i class="tzdot"></i><i class="tzdot"></i></span></span></button><button onClick="{{ onWs.4 }}" class="tzws {{ w.4 }}"><span class="arabic">4</span><span class="mayan"><span class="mayanrow"><i class="tzdot"></i><i class="tzdot"></i><i class="tzdot"></i><i class="tzdot"></i></span></span></button><button onClick="{{ onWs.5 }}" class="tzws {{ w.5 }}"><span class="arabic">5</span><span class="mayan"><span class="mayanrow"><i class="tzbarn"></i></span></span></button><button onClick="{{ onWs.6 }}" class="tzws {{ w.6 }}"><span class="arabic">6</span><span class="mayan"><span class="mayanrow"><i class="tzdot"></i></span><span class="mayanrow"><i class="tzbarn"></i></span></span></button></div><sc-if value="{{ s.submap }}" hint-placeholder-val="{{ false }}"><div class="tzsep"></div><div class="tzmod" style="gap:8px;cursor:default"><span style="color:var(--gold);font-weight:600">resize</span><span class="tzsub" style="color:var(--muted)">hjkl · esc</span></div></sc-if><div style="flex:1"></div><div class="tzmod" onClick="{{ onOpen.np }}" data-mod="np" style="gap:10px;padding:3px 13px 3px 5px;height:auto;background:rgba(232,234,237,.055);border:1px solid rgba(232,234,237,.06);border-radius:12px"><div style="width:26px;height:26px;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.45);flex:none;background:linear-gradient(135deg,var(--accentdim),var(--gold))"><image-slot id="np-art" shape="rounded" radius="6" fit="cover" placeholder=""></image-slot></div><div style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:none"><span style="font-size:11px;font-weight:600;color:var(--text);white-space:nowrap">Teotihuacan</span><span class="tzsub" style="white-space:nowrap">Rodrigo Amarante · 2:14</span></div><div class="eq"><i style="height:7px"></i><i style="height:11px"></i><i style="height:4px"></i><i style="height:9px"></i></div></div><div style="flex:1"></div><button onClick="{{ ungroup.priv }}" class="priv-group tzmod" style="gap:7px;color:var(--urgent)" title="Click to expand"><span class="privdot" style="width:7px;height:7px;border-radius:50%;background:var(--urgent);box-shadow:0 0 8px var(--urgent)"></span><span class="tzval" style="color:var(--urgent)">3 capturing</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="opacity:.6"><path d="m8 10 4 4 4-4"></path></svg></button><div class="priv-items tzmod" style="gap:6px;color:var(--urgent)" title="Camera in use — zoom"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 9.5 21 6v12l-6-3.5z"></path><rect x="3" y="6" width="12" height="12" rx="2.5"></rect></svg><span class="tzsub" style="color:var(--urgent)">zoom</span></div><div class="priv-items tzmod" style="gap:6px;color:var(--gold)" title="Microphone in use"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"></path></svg></div><div class="priv-items tzmod" style="gap:6px;color:var(--urgent)" title="Screen recording"><span style="width:8px;height:8px;border-radius:50%;background:var(--urgent);box-shadow:0 0 8px var(--urgent)"></span><span class="tzval" style="color:var(--urgent)">12:04</span></div><button onClick="{{ group.priv }}" class="priv-items tzmod" style="padding:0 5px;color:var(--faint)" title="Group privacy indicators"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 9h6V3M20 15h-6v6"></path></svg></button><div class="tier3 idle tzmod" style="color:var(--accent)" title="Keeping the session awake — click to release"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 8h11v5a5.5 5.5 0 0 1-11 0z"></path><path d="M16 9h1.8a2.2 2.2 0 0 1 0 4.4H16M5 20h11"></path></svg></div><div class="tier3 idle tzmod" style="gap:6px;color:var(--gold)" title="Night light on at 4200 K"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path></svg><span class="tzsub" style="color:var(--gold)">4200K</span></div><button onClick="{{ onOpen.ai }}" data-mod="ai" class="tzmod" style="gap:7px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.7"><path d="M12 3.5 14.3 9l5.7.6-4.3 3.9 1.2 5.6L12 16.3 7.1 19.1l1.2-5.6L4 9.6 9.7 9z"></path></svg><span class="tzval" style="color:var(--gold)">68%</span><span class="tzsub">4h 12m</span></button><button onClick="{{ onOpen.llm }}" data-mod="llm" class="tzmod" style="gap:7px" title="{{ s.llmTip }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="4"></rect><rect x="9" y="9" width="6" height="6" rx="1.5" fill="var(--accent)" stroke="none"></rect><path d="M9 1.8v2.2M15 1.8v2.2M9 20v2.2M15 20v2.2M1.8 9H4M1.8 15H4M20 9h2.2M20 15h2.2"></path></svg><span class="tzval">{{ s.llmSize }}</span><span data-accel="{{ s.accelCpu }}" class="tzaccel">{{ s.accel }}</span><span data-busy="{{ s.llmBusy }}" class="tzsub tztps">{{ s.llmTps }}</span></button><div class="tier3 idle tzmod" style="gap:7px;padding:0 4px" title="System tray"><span style="width:15px;height:15px;border-radius:4px;background:linear-gradient(135deg,#4a5aa8,#2f3a6e)"></span><span style="width:15px;height:15px;border-radius:4px;background:linear-gradient(135deg,#6b8e4e,#3f5a2c)"></span><span style="width:15px;height:15px;border-radius:4px;background:linear-gradient(135deg,#9a5a3a,#5f3520)"></span></div><button onClick="{{ ungroup.sys }}" data-mod="sys" class="sys-group tzmod" style="gap:9px" title="Click to expand"><span class="tzlab">SYS</span><span class="tzval">31%</span><span class="tzsub">·</span><span class="tzval">18.4G</span><span class="tzsub">·</span><span class="tzval">44%</span><span class="tzsub">71°</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="opacity:.55"><path d="m8 10 4 4 4-4"></path></svg></button><button onClick="{{ onOpen.cpu }}" data-mod="cpu" class="sys-items tzmod" style="gap:7px"><span class="tzlab">CPU</span><svg width="26" height="13" viewBox="0 0 26 13" fill="none" preserveAspectRatio="none"><polyline points="0,10 3,8 6,9 9,5 12,7 15,3 18,6 21,4 24,7 26,5" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"></polyline></svg><span class="tzval">31%</span><span class="tzsub">62°</span></button><button onClick="{{ onOpen.mem }}" data-mod="mem" class="sys-items tzmod" style="gap:7px"><span class="tzlab">MEM</span><svg width="26" height="13" viewBox="0 0 26 13" fill="none" preserveAspectRatio="none"><polyline points="0,7 3,7 6,6 9,6 12,5 15,5 18,4 21,5 24,4 26,4" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"></polyline></svg><span class="tzval">18.4G</span><span class="tzsub">/32</span></button><button onClick="{{ onOpen.gpu }}" data-mod="gpu" class="sys-items tier3 tzmod" style="gap:7px"><span class="tzlab">GPU</span><svg width="26" height="13" viewBox="0 0 26 13" fill="none" preserveAspectRatio="none"><polyline points="0,11 3,10 6,6 9,7 12,2 15,4 18,3 21,6 24,5 26,8" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"></polyline></svg><span class="tzval">44%</span><span class="tzsub">71° 168W</span></button><button onClick="{{ group.sys }}" class="sys-items tzmod" style="padding:0 5px;color:var(--faint)" title="Group system metrics"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 9h6V3M20 15h-6v6"></path></svg></button><div class="tzsep"></div><button onClick="{{ onOpen.net }}" data-mod="net" class="tzmod" style="gap:7px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4.5 10.5a11 11 0 0 1 15 0M8 14a6 6 0 0 1 8 0"></path><circle cx="12" cy="18" r="1.1" fill="currentColor"></circle></svg><div style="display:flex;flex-direction:column;gap:0;align-items:flex-start"><span style="font-size:11px;font-weight:600;color:var(--sub);line-height:1.15">Coatlicue-5G</span><span class="tzsub">↓12.4 ↑1.1 MB/s</span></div></button><button onClick="{{ onOpen.bt }}" data-mod="bt" class="idle tzmod" style="gap:6px;color:var(--accent)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 7.5 17 16.5 12 21V3l5 4.5L7 16.5"></path></svg><span class="tzsub" style="color:var(--accent)">MX 82%</span></button><button onClick="{{ onOpen.vol }}" data-mod="vol" class="tzmod" style="gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 5 6.5 9H3v6h3.5L11 19z"></path><path d="M15 9.8a3.2 3.2 0 0 1 0 4.4"></path></svg><span class="tzval">64%</span></button><div class="tier3 idle tzmod" style="gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"></path></svg><span class="tzval">78%</span></div><button onClick="{{ onOpen.bat }}" data-mod="bat" class="tzmod" style="gap:7px"><svg width="20" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="7" width="17" height="10" rx="2.5"></rect><path d="M21.5 10.5v3"></path><rect x="4" y="9" width="9" height="6" rx="1" fill="var(--accent)" stroke="none"></rect></svg><span class="tzval">62%</span><span class="tzsub">3h 40m</span></button><div class="tzsep"></div><button onClick="{{ onOpen.weather }}" data-mod="weather" class="tzmod" style="gap:7px" title="Mexico City — partly cloudy"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8.5" r="3.2" stroke="var(--gold)"></circle><path d="M8.5 2.6v1.4M8.5 13v1.4M2.6 8.5H4M13 8.5h1.4M4.3 4.3l1 1M11.7 11.7l1 1M12.7 4.3l-1 1M5.3 11.7l-1 1" stroke="var(--gold)"></path><path d="M9 20.5h8.6a3.1 3.1 0 0 0 .3-6.2 4.4 4.4 0 0 0-8.5-.7A2.9 2.9 0 0 0 9 20.5z" fill="var(--barbg)"></path></svg><span class="tzval">23°</span><span class="tzsub">18° / 27°</span></button><button onClick="{{ onOpen.bell }}" data-mod="bell" class="tzmod" style="gap:6px;color:var(--accent);position:relative"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 4 1.5 5.5 1.5 5.5H5s1.5-1.5 1.5-5.5z"></path><path d="M10 18.5a2.2 2.2 0 0 0 4 0"></path></svg><span style="font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--onacc);background:var(--accent);border-radius:7px;padding:1px 5px">3</span></button><button onClick="{{ onOpen.clock }}" data-mod="clock" class="tzmod" style="gap:9px;color:var(--text);font-weight:600;letter-spacing:.2px"><span>Sat 02 Aug</span><span style="font-family:var(--mono);font-feature-settings:'tnum' 1">22:41</span></button><button onClick="{{ onOpen.power }}" data-mod="power" class="tzmod" style="color:var(--gold);padding:0 11px 0 7px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v8.5"></path><path d="M6.8 6.6a8 8 0 1 0 10.4 0"></path></svg></button></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;s&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onWs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const s = this.props.s || {};
    const occupied = { 1:true, 2:true, 3:true, 5:true };
    const urgent = 4;
    const w = {};
    for (let i=1;i<=6;i++){
      w[i] = s.ws===i ? 'active' : (i===urgent ? 'urgent' : (occupied[i] ? 'occupied' : ''));
    }
    return { s, w, submapClass: s.submap ? 'submap' : '', onOpen: this.props.onOpen || {}, onWs: this.props.onWs || {},
      group: this.props.group || {}, ungroup: this.props.ungroup || {} };
  }
}
</script>
</body>
</html>
