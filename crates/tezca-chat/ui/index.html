<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tezca AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="lp">
      <header class="lphead">
        <div class="lpdrag" data-tauri-drag-region></div>

        <button class="lpsel" id="modelBtn" type="button">
          <span class="lpdot" id="dot"></span>
          <div style="min-width: 0; flex: 1">
            <div class="lpname" id="modelName">no model</div>
            <div class="lprow" style="gap: 6px; margin-top: 2px">
              <span class="lpaccel" id="accel" hidden></span>
              <span class="lpmeta" id="modelMeta"></span>
            </div>
          </div>
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" style="opacity: 0.6">
            <path d="m8 10 4 4 4-4"></path>
          </svg>
        </button>

        <button class="lpbtn icon" id="sessionsBtn" type="button" title="Conversations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M20 14.5a2.5 2.5 0 0 1-2.5 2.5H8l-4 3.5V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5z"></path>
          </svg>
        </button>
        <button class="lpbtn icon" id="settingsBtn" type="button" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="3.2"></circle>
            <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"></path>
          </svg>
        </button>
        <button class="lpbtn icon" id="closeBtn" type="button" title="Close (SUPER I)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <path d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        </button>
      </header>

      <div id="menus"></div>
      <div id="drawer"></div>

      <div class="lpscroll" id="scroll"></div>

      <footer class="lpfoot">
        <div class="lpchips" id="chips"></div>
        <div id="attachRow"></div>

        <div class="lpcomposer">
          <textarea class="lpta" id="ta" rows="1" placeholder="Ask the local model…"></textarea>
          <button class="lpbtn lpstop" id="stopBtn" type="button" hidden>stop</button>
          <button class="lpsend" id="sendBtn" type="button" title="Send (⏎)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M6 11l6-6 6 6"></path>
            </svg>
          </button>
        </div>

        <div class="lpstatus">
          <div class="lprow">
            <div class="lprow" style="gap: 10px">
              <span class="lpmeta lptps" id="tps">idle</span>
              <div class="lpspark" id="spark"></div>
            </div>
            <span class="lpmeta" id="ctxUse"></span>
          </div>
          <div class="lprow" style="margin-top: 6px">
            <span class="lpmeta" id="vramLabel">VRAM</span>
            <span class="lpmeta">SUPER I</span>
          </div>
          <div class="tzmeter" style="margin-top: 5px"><i id="vramBar" style="width: 0%"></i></div>
        </div>
      </footer>
    </div>

    <!-- Registered before the module loads, because a module that throws while
         being *evaluated* aborts before any listener inside it exists — the
         window then stays hidden and the process stays alive, which looks
         exactly like the binary doing nothing. -->
    <script>
      window.addEventListener('error', (e) => {
        const msg = `${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`;
        window.__TAURI__?.core?.invoke('ai_log', { level: 'fatal', message: msg });
        const w = window.__TAURI__?.window?.getCurrentWindow?.();
        w?.show?.();
        document.body.textContent = msg;
        document.body.style.cssText = 'padding:24px;font:12px monospace;color:#e06c75';
      });
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
