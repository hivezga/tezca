# Tezca Rust workspace.
# The `tezca` control CLI lives in crates/tezca-cli (std-only); `tezca-dock`
# (Phase 5) is the bespoke gtk4-rs magnifying dock and carries the GTK stack.
[workspace]
resolver = "2"
members = ["crates/tezca-cli", "crates/tezca-dock", "crates/tezca-bar", "crates/tezca-barlayout", "crates/tezca-settings"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["hivezga"]
repository = "https://github.com/hivezga/tezca"

[profile.release]
opt-level = "z"
lto = true
# Keep the symbol table and line tables in the shipped binaries. These are
# long-lived desktop processes whose crashes land in systemd-coredump hours
# later, with no reproducer and no operator watching — and a stripped binary
# turns such a dump into library frames and hex offsets, which is exactly how
# three tezca-bar SIGSEGVs became undiagnosable. `line-tables-only` names the
# file and line without carrying full DWARF; the cost is a few MB on disk and
# nothing at runtime (debug info is not paged in unless something reads it).
strip = "none"
debug = "line-tables-only"
codegen-units = 1
panic = "abort"
